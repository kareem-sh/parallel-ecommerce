global:
  scrape_interval: 5s # Collect Metrics each 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090 # Monitor Yourself

  - job_name: "cadvisor" # Create Monitor Job
    static_configs:
      - targets:
          - cadvisor:8080 # Ask cAdvisor Container for metrics

  - job_name: mysql
    static_configs:
      - targets:
          - mysql-exporter:9104

  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter:9121

  - job_name: laravel
    metrics_path: /metrics
    static_configs:
      - targets:
          - nginx:80

# So every 5s Prometheus do this
# GET cadvisor:8080/metrics
# GET prometheus:9090/metrics
# GET mysql:9104/metrics
# GET redis:9121/metrics
# Then stores metrics inside its own TSDB Time Series Database
