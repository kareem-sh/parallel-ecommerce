# Laravel app settings are loaded from .env (env_file).
# Docker-only overrides below use service hostnames inside the compose network.
# See .env.example "Docker Compose" section for optional override variables.

x-app-common: &app-common
  restart: unless-stopped
  build:
    context: .
  env_file:
    - .env
  environment:
    DB_HOST: ${DOCKER_DB_HOST:-mysql}
    REDIS_HOST: ${DOCKER_REDIS_HOST:-redis}
    APP_URL: ${DOCKER_APP_URL:-http://localhost:8000}
    CACHE_STORE: ${DOCKER_CACHE_STORE:-redis}
    SESSION_DRIVER: ${DOCKER_SESSION_DRIVER:-redis}
    QUEUE_CONNECTION: ${DOCKER_QUEUE_CONNECTION:-redis}
    LOG_STACK: ${DOCKER_LOG_STACK:-single,stderr}
  volumes:
    - ./storage:/var/www/html/storage
    - ./app:/var/www/html/app:ro
    - ./routes:/var/www/html/routes:ro
    - ./tests:/var/www/html/tests:ro
    - ./docker/php-fpm/zzz-custom.conf:/usr/local/etc/php-fpm.d/zzz-custom.conf:ro
  networks:
    - ecommerce-network

services:
  app:
    <<: *app-common
    expose:
      - "9000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  app2:
    <<: *app-common
    expose:
      - "9000"
    depends_on:
      app:
        condition: service_started

  worker:
    <<: *app-common
    command:
      [
        "sh",
        "-c",
        "php artisan queue:work redis --queue=receipts,reports,default --sleep=1 --tries=3 --timeout=60",
      ]
    depends_on:
      app:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${DOCKER_HTTP_PORT:-8000}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      app:
        condition: service_started
      app2:
        condition: service_started
    networks:
      - ecommerce-network

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${DOCKER_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u${DB_USERNAME} -p${DB_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ecommerce-network

  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    ports:
      - "${DOCKER_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ecommerce-network

  k6:
    image: grafana/k6:0.51.0
    profiles: ["test"]
    environment:
      BASE_URL: ${K6_BASE_URL:-http://nginx:80}
      K6_OUT: influxdb=http://influxdb:8086/k6
    volumes:
      - ./tests/k6:/scripts
      - ./storage/k6:/results
    depends_on:
      - nginx
    entrypoint: ["k6"]
    networks:
      - ecommerce-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  influxdb:
    image: influxdb:1.8
    ports:
      - "${DOCKER_INFLUXDB_PORT:-8086}:8086"
    environment:
      INFLUXDB_DB: ${INFLUXDB_DB:-k6}
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
    volumes:
      - influxdb-data:/var/lib/influxdb
    networks:
      - ecommerce-network

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "${DOCKER_GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - influxdb
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  influxdb-data:
